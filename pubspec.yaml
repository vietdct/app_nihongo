name: nihongo
description: Ứng dụng học tiếng Nhật theo khung JLPT (N5–N1).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + DI
  flutter_riverpod: ^2.5.1

  # Điều hướng
  go_router: ^14.2.7

  # Backend (Auth + Data + Storage)
  supabase_flutter: ^2.5.6

  # Lưu token an toàn (Keychain/Keystore) + kiểm tra kết nối
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5

  # Cache offline (Pha 2) — SQLite type-safe, có reactive Stream
  drift: ^2.20.3
  drift_flutter: ^0.2.2
  path_provider: ^2.1.4
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true
