name: nihongo
description: Ứng dụng học tiếng Nhật theo khung JLPT (N5–N1).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management + DI
  flutter_riverpod: ^2.5.1

  # Điều hướng
  go_router: ^14.2.7

  # Backend (Auth + Data + Storage)
  supabase_flutter: ^2.5.6

  # Lưu token an toàn (Keychain/Keystore) + kiểm tra kết nối
  flutter_secure_storage: ^9.2.2
  connectivity_plus: ^6.0.5

  # Cache offline (Pha 2) — SQLite type-safe, có reactive Stream
  drift: ^2.20.3
  drift_flutter: ^0.2.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # Parse path "d" của KanjiVG (Pha 3d) để tự vẽ animation nét chữ Hán
  path_drawing: ^1.0.1

  # AI Kaiwa — nói/nghe bằng giọng nói
  speech_to_text: ^7.0.0
  flutter_tts: ^4.2.2
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  mocktail: ^1.0.4
  build_runner: ^2.4.13
  drift_dev: ^2.20.3

flutter:
  uses-material-design: true

  # Font đóng gói cục bộ (Be Vietnam Pro + Zen Maru Gothic) — theo thiết kế lại
  # giao diện. Bundle sẵn trong assets thay vì tải qua CDN lúc chạy: hoạt động
  # offline, không phụ thuộc mạng khi test/build.
  fonts:
    - family: BeVietnamPro
      fonts:
        - asset: assets/fonts/BeVietnamPro-Regular.ttf
        - asset: assets/fonts/BeVietnamPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/BeVietnamPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BeVietnamPro-Bold.ttf
          weight: 700
        - asset: assets/fonts/BeVietnamPro-ExtraBold.ttf
          weight: 800
    - family: ZenMaruGothic
      fonts:
        - asset: assets/fonts/ZenMaruGothic-Regular.ttf
        - asset: assets/fonts/ZenMaruGothic-Medium.ttf
          weight: 500
        - asset: assets/fonts/ZenMaruGothic-Bold.ttf
          weight: 700
        - asset: assets/fonts/ZenMaruGothic-Black.ttf
          weight: 900
